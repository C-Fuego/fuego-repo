name: Full repository install test

on:
  schedule:
    - cron: "41 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-repository-install-test
  cancel-in-progress: false

jobs:
  install-all-published-packages:
    name: Install every published package in a disposable CachyOS container
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CachyOS builder
        id: builder
        uses: $/.github/actions/setup-builder
        with:
          restore-caches: 'false'

      - name: Download the current published repository and all packages
        shell: bash
        env:
          R2_PREFIX: x86_64
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -Eeuo pipefail
          export AWS_ENDPOINT_URL_S3="${R2_ENDPOINT%/}"
          export AWS_DEFAULT_REGION=auto
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          mkdir -p published/x86_64 incoming
          aws s3 cp --only-show-errors --no-progress --recursive \
            "s3://${R2_BUCKET}/${R2_PREFIX}/" incoming/
          mv incoming/*.pkg.tar.zst published/x86_64/ 2>/dev/null || true
          find incoming -maxdepth 1 -type f -not -name '*.pkg.tar.zst' -exec cp -t published/x86_64/ {} +
          count="$(find incoming -maxdepth 1 -type f -name '*.pkg.tar.zst' | wc -l)"
          [[ "$count" -gt 0 ]] || { echo 'No published packages downloaded.' >&2; exit 1; }
          [[ -s published/x86_64/fuego-repo.db ]] || { echo 'Published repository database missing.' >&2; exit 1; }
          echo "Downloaded $count published package artifacts."

      - name: Install all packages and verify installed runtime
        shell: bash
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/published/x86_64:/repository:ro" \
            --volume "$GITHUB_WORKSPACE/incoming:/incoming:ro" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --env INSTALL_TEST_ALL=1 \
            --env REPOSITORY_NAME=fuego-repo \
            "$BUILDER_IMAGE" \
            bash /workspace/scripts/repository-install-test.sh

  notify:
    name: Notify failure or recovery
    needs: [install-all-published-packages]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (for the local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the failure issue
        uses: $/.github/actions/notify-failure
        with:
          title: "[CI] Full repository install test failed"
          outcome: ${{ needs.install-all-published-packages.result == 'failure' && 'failure' || (needs.install-all-published-packages.result == 'success' && 'recovered' || 'none') }}
