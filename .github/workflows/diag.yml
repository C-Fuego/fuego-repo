name: diag

# 一次性诊断工作流（手动触发）：
#   Actions → diag → Run workflow
# 在 archlinux 容器里打印真实工具链，并复现/定位 Rust 包的链接失败
# （CI 里 pipes-rs / cnmplayer 的 "ld.lld: undefined symbol" 就是靠它定位）。
# 不想留着的可以直接删掉本文件与 ci/diag-container.sh。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 容器内诊断（工具链 + pipes-rs 链接复现）
        run: |
          docker run --rm -v "$PWD":/work -w /work archlinux:latest \
            bash /work/ci/diag-container.sh
