name: build

# 触发:
#   1. schedule cron — 每天轮询上游 (git-head/git-tag/release/appimage), 有变动则构建
#   2. workflow_dispatch — 手动全量构建
#   3. push 到 pkgbuilds/** — 改补丁/版本时全量构建
# 产物 + PKGBUILD bump 变更 commit 回 GitHub, 并镜像到 Codeberg。
#
# 设计说明: 宿主用 ubuntu-latest (自带 git, checkout 产生标准 .git),
# 构建时 docker run 进入 archlinux 容器执行 makepkg, workspace 以 -v 挂载,
# 产物落在宿主工作区, 之后用宿主 git 提交/推送 (避免容器内无 .git 的问题)。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'pkgbuilds/**'
      - 'build.sh'
      - 'check-upstream.sh'
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 轮询上游 & 确定构建清单
        id: plan
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ./check-upstream.sh 2>&1 \
              && echo "NO_CHANGE=false" >> "$GITHUB_ENV" \
              || echo "NO_CHANGE=true" >> "$GITHUB_ENV"
          else
            echo "NO_CHANGE=false" >> "$GITHUB_ENV"
          fi

      - name: 构建包 (docker archlinux 容器内)
        if: env.NO_CHANGE == 'false'
        run: |
          docker run --rm -v "$PWD":/work -w /work archlinux:latest \
            bash /work/ci/container-env.sh
      - name: 提交产物与上游跟踪
        if: env.NO_CHANGE == 'false'
        run: |
          git config user.name "fuego-ci"
          git config user.email "fuego-ci@users.noreply.github.com"
          git add -- packages/ pkgbuilds/
          if git diff --cached --quiet; then
            echo "无产物变更, 跳过提交"
          else
            git commit -m "ci: 自动构建 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像到 Codeberg
        if: env.NO_CHANGE == 'false'
        run: |
          CODEBERG_URL="https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_OWNER}/${CODEBERG_REPO}.git"
          git remote add codeberg "$CODEBERG_URL" 2>/dev/null || \
            git remote set-url codeberg "$CODEBERG_URL"
          git push --force codeberg HEAD:main
        env:
          CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_OWNER: ${{ secrets.CODEBERG_OWNER }}
          CODEBERG_REPO: ${{ vars.CODEBERG_REPO }}