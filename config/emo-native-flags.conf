# Portable x86-64-v3 makepkg profile (AVX2/BMI2/FMA; Haswell/Zen 1 or newer, any vendor).
# Never name a vendor-specific microarchitecture here: znver3 emits AMD-only SSE4a
# instructions (insertq/extrq), which raise SIGILL on Intel CPUs.
CFLAGS="-march=x86-64-v3 -mtune=generic -O3 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now"
RUSTFLAGS="-C target-cpu=x86-64-v3 -C opt-level=3"
